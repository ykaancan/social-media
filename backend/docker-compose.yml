# Local development database. Tests do NOT use this — they start their own
# Postgres with Testcontainers, so `./gradlew test` needs Docker but not this file.
services:
  postgres:
    image: postgres:16
    container_name: brand-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: brand
      POSTGRES_USER: brand
      POSTGRES_PASSWORD: brand
    ports:
      - "5432:5432"
    volumes:
      - brand-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brand -d brand"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  brand-postgres-data:
