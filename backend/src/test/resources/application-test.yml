# The datasource is supplied by AbstractIntegrationTest's Testcontainers registry.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

brand:
  jwt:
    # Test-only key: base64 of "brand-test-secret-key-for-integration-tests!!".
    secret: YnJhbmQtdGVzdC1zZWNyZXQta2V5LWZvci1pbnRlZ3JhdGlvbi10ZXN0cyEh
    access-ttl: 15m
    refresh-ttl: 30d
  media:
    dir: build/test-media
  public-base-url: http://localhost:8080
  mail:
    from: no-reply@test.local
    enabled: false
  cors:
    allowed-origins:
      - http://localhost:8081
  # [B5] No background timer in tests: BoardIntegrationTest calls
  # BoardHousekeeping.run() directly, so "the undo window expired" is a fact
  # about the frozen clock and not a race with a scheduler.
  housekeeping:
    enabled: false
  # [D21] The auth rate limits are OFF for the suite: every test shares one
  # context and one loopback address, and the suite registers and logs in far
  # more than 300 times an hour. AuthRateLimitIntegrationTest switches on the
  # limits it needs through AuthRateLimiter's package-private test seam and
  # resets them after every test.
  limits:
    failed-logins-per-email: 0
    failed-logins-per-address: 0
    sign-ups-per-address: 0
    password-resets-per-email: 0
    password-resets-per-address: 0

logging:
  level:
    app.brand: INFO
    org.hibernate.SQL: WARN
