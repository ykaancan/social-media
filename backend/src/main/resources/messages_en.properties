# The server-rendered password-reset pages and the reset mail. Every key exists in
# messages_tr.properties too (CLAUDE.md: en + tr, same key set, from day one).
# UTF-8; spring.messages.encoding pins it.

reset.form.title=Choose a new password
reset.form.heading=Choose a new password
reset.form.hint=This link works once and expires one hour after it was requested.
reset.form.password=New password
reset.form.confirm=Repeat it
reset.form.submit=Set password
# {0} is the password length limit.
reset.form.error.tooShort=Your password must be at least {0} characters.
reset.form.error.tooLong=Your password must be at most {0} characters.
reset.form.error.mismatch=The two passwords do not match.

reset.done.title=Password changed
reset.done.heading=Password changed
reset.done.body1=Open the app and sign in with your new password.
reset.done.body2=Everywhere you were already signed in has been signed out.

reset.invalid.title=This link no longer works
reset.invalid.heading=This link no longer works
reset.invalid.body1=Reset links expire after an hour and can only be used once.
reset.invalid.body2=Ask for a new one from the sign-in screen in the app.

mail.reset.subject=Reset your password
mail.reset.body.intro=Open this link to choose a new password. It expires in one hour.
