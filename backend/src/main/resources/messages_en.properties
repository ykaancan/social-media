# The server-rendered password-reset pages and the reset mail. Every key exists in
# messages_tr.properties too (CLAUDE.md: en + tr, same key set, from day one).
# UTF-8; spring.messages.encoding pins it.

reset.form.title=Choose a new password
reset.form.heading=Choose a new password
reset.form.hint=This link works once and expires one hour after it was requested.
reset.form.password=New password
reset.form.confirm=Repeat it
reset.form.submit=Set password
# {0} is the password length limit.
reset.form.error.tooShort=Your password must be at least {0} characters.
reset.form.error.tooLong=Your password must be at most {0} characters.
reset.form.error.mismatch=The two passwords do not match.

reset.done.title=Password changed
reset.done.heading=Password changed
reset.done.body1=Open the app and sign in with your new password.
reset.done.body2=Everywhere you were already signed in has been signed out.

reset.invalid.title=This link no longer works
reset.invalid.heading=This link no longer works
reset.invalid.body1=Reset links expire after an hour and can only be used once.
reset.invalid.body2=Ask for a new one from the sign-in screen in the app.

mail.reset.subject=Reset your password
mail.reset.body.intro=Open this link to choose a new password. It expires in one hour.

# ---------------------------------------------------------------- push [B8]
# One title and one body per PushKind, rendered into the outbox row at enqueue
# time in the language of that account's most recently seen device. {0} is the
# event name; the .noEvent variant is used when there is no event to name.
#
# Two rules the copy must keep: no identity (never a name, a hint, or anything a
# recipient could not already see) and no content (never the text of a message).
# "Someone" is as specific as a body about a person ever gets.

push.inbox_new.title=New message
push.inbox_new.body=Someone wrote on your wall at {0}.
push.inbox_new.body.noEvent=Someone wrote on your wall.

push.thread_message.title=New reply
push.thread_message.body=New reply in a thread from {0}.
push.thread_message.body.noEvent=New reply in a thread.

push.post_approved.title=Post published
push.post_approved.body=Your post is on the board at {0}.
push.post_approved.body.noEvent=Your post is on the board.

push.post_rejected.title=Not published
push.post_rejected.body=Your post at {0} was not published.
push.post_rejected.body.noEvent=Your post was not published.

push.post_board_closed.title=Board closed
push.post_board_closed.body=The board at {0} closed before your post was reviewed.
push.post_board_closed.body.noEvent=The board closed before your post was reviewed.

push.account_approved.title=You are in
push.account_approved.body=Your account has been approved. Open the app to get started.

push.warned.title=A note from the moderators
push.warned.body=An admin reviewed something you wrote. Please keep it friendly.
